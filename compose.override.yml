# docker-compose.override.yml (DEVELOPMENT ONLY)
services:
  api-gateway:
    env_file:
      - ./.env
    command: pnpm dev
    volumes:
      - .:/app
      - /app/node_modules

  ride-worker:
    env_file:
      - ./.env
    command: pnpm dev
    volumes:
      - .:/app
      - /app/node_modules
